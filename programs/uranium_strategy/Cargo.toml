[package]
name = "uranium-strategy"
version = "0.1.0"
description = "Finite-reserve burn-to-build mining strategy protocol on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "uranium_strategy"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=1.1.2"
anchor-spl = { version = "=1.1.2", features = ["associated_token", "token", "token_2022"] }
